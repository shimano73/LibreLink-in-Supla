# Jedna instancja sd4linux, z osobnym kanałem dla każdego z dwóch profili.
# Profile w JSON są sortowane alfabetycznie według nazwy.
# Przed uruchomieniem uzupełnij serwer SUPLA i e-mail konta.
name: LibreLink glucose
log_level: info
state_files_path: "/home/wyse/libre/supla-state"
security_level: 0

supla:
  server: "svr123.supla.org" # podmień na serwer SUPLA przypisany do konta
  mail: "twoj-email-konta-supla@example.com"
  proto: 23

channels:
  - type: ThermometerParsed
    name: libre_glucose_1
    initial_caption: "Glukoza LibreLink 1"
    source:
      type: File
      file: "/home/wyse/libre/state.json"
      expiration_time_sec: 300
    parser:
      type: Json
    temperature: "/patients/0/glucose"

  - type: ThermometerParsed
    name: libre_glucose_2
    initial_caption: "Glukoza LibreLink 2"
    source:
      type: File
      file: "/home/wyse/libre/state.json"
      expiration_time_sec: 300
    parser:
      type: Json
    temperature: "/patients/1/glucose"